# 1. Server Configuration
server.port=8081
spring.application.name=payment-service

# 2. Database Configuration (Use your EXISTING ArtEvo Database)
spring.datasource.url=jdbc:mysql://localhost:3306/artevo_db
spring.datasource.username=root
# TODO: Replace with your actual MySQL password
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Hibernate Settings
# 'update' will create the new table without deleting old data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true